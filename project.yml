name: CaptureDesktop
options:
  bundleIdPrefix: top.capturedesk
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
targets:
  CaptureDesktop:
    type: application
    platform: macOS
    sources:
      - CaptureDesktop
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: CaptureDesktop/Info.plist
      properties:
        CFBundleDisplayName: CaptureDesktop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: CaptureDesktop records your camera when the Camera source is turned on.
        NSMicrophoneUsageDescription: CaptureDesktop records your microphone when the Microphone source is turned on.
    entitlements:
      path: CaptureDesktop/CaptureDesktop.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.capturedesk.CaptureDesk
        PRODUCT_NAME: CaptureDesktop
        # Local builds use these. Releases keep the major.minor from MARKETING_VERSION
        # and replace the rest with the commit count (see scripts/release.sh).
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
